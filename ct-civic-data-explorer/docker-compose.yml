# Log rotation for both services: without it, container logs grow until the disk is full.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes" # the app never needs root
    # UTF-8, case-sensitive comparisons and UTC, matching what the app sets per connection.
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_as_cs", "--default-time-zone=+00:00"]
    ports:
      # Host port follows DB_PORT in .env (3307 by default, since 3306 is often taken locally).
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    healthcheck:
      # TCP only answers once first-run initialization has finished.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u $${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - mysqldata:/var/lib/mysql

  app:
    build: .
    restart: unless-stopped
    init: true # forwards SIGTERM to Node so shutdown is graceful, and reaps child processes
    logging: *default-logging
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      PORT: "3000" # the port inside the container; PORT in .env is the host port below
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    # exec replaces the shell, so Node receives the stop signal and can finish requests in flight.
    command: ["sh", "-c", "node scripts/migrate.js && exec node src/server.js"]
    stop_grace_period: 15s

volumes:
  mysqldata:
