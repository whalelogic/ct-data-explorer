x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    logging: *logging
    environment:
      MYSQL_DATABASE: ${DB_NAME:?required}
      MYSQL_USER: ${DB_USER:?required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?required}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_as_cs
      - --default-time-zone=+00:00
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --max-connections=20
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql -h 127.0.0.1 -u \"$${MYSQL_USER}\" \"$${MYSQL_DATABASE}\" -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - db:/var/lib/mysql
    networks: [data]

  app:
    build: ..
    restart: unless-stopped
    logging: *logging
    env_file: /opt/ctde/runtime.env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      PORT: "3000"
      NODE_OPTIONS: --max-old-space-size=384
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [default, data]

  proxy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      CTDE_HOST: ${CTDE_HOST:?required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data

networks:
  data:
    internal: true

volumes:
  db:
  caddy:
