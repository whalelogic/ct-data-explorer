<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Datasets · CT Civic Data Explorer</title>
    <link rel="stylesheet" href="/css/app.css" />
    <script type="module" src="/js/admin.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site"><a class="brand" href="/">CT Civic Data Explorer</a></header>
    <main id="main" class="container">
      <nav id="admin-nav" class="sub-nav" aria-label="Administration"></nav>
      <div class="workspace-heading">
        <div>
          <h1>Datasets</h1>
          <p class="page-intro">Find a dataset to review, publish or update. Drafts need their fields chosen before anyone can use them.</p>
        </div>
        <a class="button" href="/admin/datasets/new">+ Add dataset</a>
      </div>
      <p id="page-status" class="status" role="alert" hidden></p>

      <section class="panel" aria-label="Datasets">
        <div class="table-filters" role="search">
          <div class="table-filter-search">
            <label for="dataset-search">Search</label>
            <input id="dataset-search" type="search" placeholder="Dataset or source name" autocomplete="off" />
          </div>
          <div>
            <label for="filter-period">Reporting period</label>
            <select id="filter-period"><option value="">All</option></select>
          </div>
          <div>
            <label for="filter-status">Status</label>
            <select id="filter-status">
              <option value="">All</option>
              <option value="published">Published</option>
              <option value="draft">Draft</option>
            </select>
          </div>
          <div>
            <label for="filter-review">Fields</label>
            <select id="filter-review">
              <option value="">All</option>
              <option value="approved">Chosen</option>
              <option value="needs-review">Need choosing</option>
            </select>
          </div>
        </div>
        <div class="choice-toolbar">
          <button id="clear-filters" type="button" class="link" hidden>Clear search and filters</button>
          <span id="dataset-count" role="status" aria-live="polite"></span>
        </div>

        <div class="table-wrap">
          <table class="data sortable">
            <caption class="sr-only">Datasets. Select a column heading to sort. Open a dataset name to manage it.</caption>
            <thead>
              <tr>
                <th scope="col" aria-sort="none"><button type="button" class="sort-button" data-sort="name">Dataset</button></th>
                <th scope="col" aria-sort="none"><button type="button" class="sort-button" data-sort="vintage">Reporting period</button></th>
                <th scope="col" class="num" aria-sort="none"><button type="button" class="sort-button" data-sort="version">Version</button></th>
                <th scope="col" class="num" aria-sort="none"><button type="button" class="sort-button" data-sort="rowCount">Rows</button></th>
                <th scope="col" aria-sort="descending"><button type="button" class="sort-button" data-sort="uploadedAt">Uploaded</button></th>
                <th scope="col">Status</th>
                <th scope="col">Fields</th>
              </tr>
            </thead>
            <tbody id="datasets-body"></tbody>
          </table>
        </div>
      </section>
    </main>
  </body>
</html>
