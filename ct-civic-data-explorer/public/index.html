<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · CT Civic Data Explorer</title>
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/dashboard.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site"><a class="brand" href="/">CT Civic Data Explorer</a></header>
  <main id="main" class="container">
    <h1>Dashboard</h1>
    <p id="page-status" class="status" role="alert" hidden></p>

    <section class="panel" aria-labelledby="search-heading">
      <h2 id="search-heading">Find a dataset or report</h2>
      <form id="dashboard-search" class="inline-form" role="search">
        <label for="search-input" class="sr-only">Dataset or report name</label>
        <input type="search" id="search-input" maxlength="100" placeholder="Search by dataset or report name" autocomplete="off">
        <button type="submit">Search</button>
        <a class="button secondary" href="/builder.html">Make report</a>
      </form>
    </section>

    <section class="panel" aria-labelledby="datasets-heading">
      <h2 id="datasets-heading">Available datasets</h2>
      <p id="datasets-status" class="status" role="status" hidden></p>
      <ul id="datasets-grid" class="report-grid" role="list"></ul>
    </section>

    <section class="panel" aria-labelledby="reports-heading">
      <div class="panel-head">
        <h2 id="reports-heading">Saved reports</h2>
      </div>
      <p id="reports-status" class="status" role="status" hidden></p>
      <ul id="reports-grid" class="report-grid" role="list"></ul>
    </section>
  </main>
</body>
</html>
