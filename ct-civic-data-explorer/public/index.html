<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Data library · CT Civic Data Explorer</title>
    <link rel="stylesheet" href="/css/app.css" />
    <script type="module" src="/js/dashboard.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site"><a class="brand" href="/">CT Civic Data Explorer</a></header>
    <main id="main" class="container">
      <div class="workspace-heading">
        <div>
          <p class="section-kicker">CTData Collaborative</p>
          <h1>Data library</h1>
          <p class="page-intro">
            Explore Connecticut communities using curated data, or continue a saved report.
          </p>
        </div>
        <a class="button" href="/explore.html">Explore data</a>
      </div>
      <p id="page-status" class="status" role="alert" hidden></p>

      <section class="panel" aria-labelledby="search-heading">
        <h2 id="search-heading">Find data</h2>
        <form id="dashboard-search" class="inline-form" role="search">
          <label for="search-input" class="sr-only">Dataset or report name</label>
          <input
            type="search"
            id="search-input"
            maxlength="100"
            placeholder="Search by dataset or report name"
            autocomplete="off"
          />
          <button type="submit">Search</button>
        </form>
      </section>

      <section class="panel" aria-labelledby="datasets-heading">
        <h2 id="datasets-heading">Datasets for exploration</h2>
        <p id="datasets-status" class="status" role="status" hidden></p>
        <ul id="datasets-grid" class="report-grid" role="list"></ul>
      </section>

      <section class="panel" aria-labelledby="reports-heading">
        <div class="panel-head">
          <h2 id="reports-heading">Your team’s saved reports</h2>
        </div>
        <p id="reports-status" class="status" role="status" hidden></p>
        <ul id="reports-grid" class="report-grid" role="list"></ul>
      </section>
    </main>
  </body>
</html>
