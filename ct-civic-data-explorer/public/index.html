<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard · CT Civic Data Explorer</title>
    <link rel="stylesheet" href="/css/app.css" />
    <script type="module" src="/js/dashboard.js"></script>
  </head>
  <body class="dashboard-page">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site"><a class="brand" href="/">CT Civic Data Explorer</a></header>
    <main id="main" class="container">
      <div class="workspace-heading dashboard-heading">
        <h1>Dashboard</h1>
        <div class="dashboard-primary-actions">
          <a class="button secondary" href="/explore">Explore data</a>
          <a class="button" href="/builder">New report</a>
        </div>
      </div>
      <p id="page-status" class="status" role="alert" hidden></p>

      <form id="dashboard-search" class="dashboard-search" role="search" aria-label="Search datasets and reports">
        <label class="sr-only" for="search-input">Search datasets and reports</label>
        <div class="inline-form">
          <input type="search" id="search-input" maxlength="100"
            placeholder="Search datasets and reports" autocomplete="off" aria-controls="datasets-grid reports-grid" />
          <button id="clear-search" type="button" class="secondary" hidden>Clear</button>
          <button type="submit">Search</button>
        </div>
      </form>

      <div data-tabs="dashboard">
        <div class="workspace-tabs" role="tablist" aria-label="Dashboard">
          <button id="datasets-tab" type="button" role="tab" aria-controls="datasets-panel" aria-selected="true">Datasets <span id="dataset-count" class="dashboard-count" aria-live="polite"></span></button>
          <button id="reports-tab" type="button" role="tab" aria-controls="reports-panel" aria-selected="false" tabindex="-1">Saved reports <span id="report-count" class="dashboard-count" aria-live="polite"></span></button>
        </div>

        <section id="datasets-panel" class="dashboard-section tab-panel" role="tabpanel" aria-labelledby="datasets-tab">
          <div class="dashboard-section-heading">
            <a id="manage-datasets" href="/admin" hidden>Manage datasets</a>
          </div>
          <p id="datasets-status" class="status" role="status">Loading datasets…</p>
          <button id="retry-datasets" type="button" class="secondary" hidden>Retry</button>
          <ul id="datasets-grid" class="report-grid" role="list" aria-busy="true"></ul>
        </section>

        <section id="reports-panel" class="dashboard-section tab-panel" role="tabpanel" aria-labelledby="reports-tab" hidden>
          <div class="dashboard-section-heading">
            <div class="dashboard-report-controls">
              <label class="dashboard-owner-filter"><input id="only-mine" type="checkbox" /> My reports</label>
              <label class="sr-only" for="report-sort">Sort reports</label>
              <select id="report-sort">
                <option value="updated">Recently updated</option>
                <option value="title">Name A–Z</option>
                <option value="oldest">Oldest first</option>
              </select>
            </div>
          </div>
          <p id="report-action-status" class="status" role="status" hidden></p>
          <p id="reports-status" class="status" role="status">Loading reports…</p>
          <button id="retry-reports" type="button" class="secondary" hidden>Retry</button>
          <ul id="reports-grid" class="report-grid" role="list" aria-busy="true"></ul>
          <div id="reports-empty" class="dashboard-empty" hidden>
            <h2 id="reports-empty-title">No saved reports</h2>
            <a class="button secondary" href="/builder">New report</a>
          </div>
          <p id="reports-limit" class="muted small" hidden>200 results. Refine your search for more.</p>
        </section>
      </div>
    </main>
  </body>
</html>
