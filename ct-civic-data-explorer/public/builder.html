<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Report builder · CT Civic Data Explorer</title>
    <link rel="stylesheet" href="/css/app.css" />
    <script defer src="/vendor/chart.js/chart.umd.min.js"></script>
    <script type="module" src="/js/builder.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site"><a class="brand" href="/">CT Civic Data Explorer</a></header>
    <main id="main" class="container">
      <p><a href="/explore">← Explore</a></p>
      <h1 id="builder-heading">Report builder</h1>
      <p id="page-status" class="status" role="alert" hidden></p>

      <div class="page-toolbar builder-toolbar">
        <div>
          <label for="report-name">Report name</label>
          <input id="report-name" form="builder-form" maxlength="200" placeholder="Report name" />
        </div>
        <div class="workspace-actions">
          <button type="button" id="save">Save report</button>
          <button type="button" id="pdf" class="secondary">Export PDF</button>
        </div>
      </div>
      <p id="builder-status" class="status" role="status" aria-live="polite" hidden></p>
      <p id="preview-status" class="status" role="status" aria-live="polite" hidden></p>

      <div class="builder-workspace" data-tabs="builder">
        <div class="workspace-tabs" role="tablist" aria-label="Report settings">
          <button type="button" role="tab" id="builder-data-tab" aria-controls="builder-data-panel" aria-selected="true" tabindex="0">Data</button>
          <button type="button" role="tab" id="builder-fields-tab" aria-controls="builder-fields-panel" aria-selected="false" tabindex="-1">Fields</button>
          <button type="button" role="tab" id="builder-content-tab" aria-controls="builder-content-panel" aria-selected="false" tabindex="-1">Content</button>
          <button type="button" role="tab" id="builder-titles-tab" aria-controls="builder-titles-panel" aria-selected="false" tabindex="-1">Titles</button>
          <button type="button" role="tab" id="builder-appearance-tab" aria-controls="builder-appearance-panel" aria-selected="false" tabindex="-1">Appearance</button>
          <button type="button" role="tab" id="builder-preview-tab" aria-controls="builder-preview-panel" aria-selected="false" tabindex="-1">Preview</button>
        </div>

        <div class="builder-grid">
          <form id="builder-form" novalidate aria-label="Report editor">
            <section id="builder-data-panel" class="tab-panel panel" role="tabpanel" aria-labelledby="builder-data-tab">
              <label for="dataset">Dataset</label>
              <select id="dataset"></select>
              <div id="location-selection" data-no-preview hidden>
                <label for="town-primary">Towns</label>
                <div class="explorer-town-entry">
                  <input id="town-primary" list="town-options" autocomplete="off" placeholder="Find a town" aria-describedby="builder-town-count" />
                  <button id="add-town" type="button" class="secondary">Add town</button>
                </div>
                <datalist id="town-options"></datalist>
                <div class="button-row">
                  <button id="select-all-towns" type="button" class="link">Select all</button>
                  <button id="clear-towns" type="button" class="link">Clear</button>
                </div>
                <p id="builder-town-count" class="small muted" role="status"></p>
                <div id="builder-towns" class="explorer-towns" aria-label="Selected towns"></div>
                <p id="builder-town-status" class="status" role="status" hidden></p>
              </div>
              <label id="benchmark-control" class="check" hidden>
                <input type="checkbox" id="benchmark" />
                Connecticut comparison
              </label>
              <fieldset id="record-filter-panel" hidden>
                <legend>Filters</legend>
                <div id="record-filters"></div>
              </fieldset>
            </section>

            <section id="builder-fields-panel" class="tab-panel panel" role="tabpanel" aria-labelledby="builder-fields-tab" hidden>
              <div data-no-preview>
                <label for="field-search">Find fields</label>
                <input id="field-search" type="search" placeholder="Field name or unit" />
              </div>
              <div class="button-row">
                <button type="button" id="select-all-fields" class="link">Select all</button>
                <button type="button" id="clear-fields" class="link">Clear</button>
                <span id="field-count" class="muted small" role="status"></span>
              </div>
              <div id="indicator-list" class="unit-field-groups"></div>
              <details class="report-customization">
                <summary>Field labels &amp; decimals</summary>
                <div id="field-overrides"></div>
                <button id="reset-overrides" type="button" class="link">Reset to dataset defaults</button>
              </details>
            </section>

            <section id="builder-content-panel" class="tab-panel panel" role="tabpanel" aria-labelledby="builder-content-tab" hidden>
              <fieldset>
                <legend>Blocks</legend>
                <label for="block-picker">Edit block</label>
                <select id="block-picker" data-no-preview></select>
                <div class="button-row">
                  <button type="button" class="secondary" data-add-block="chart">Add chart</button>
                  <button type="button" class="secondary" data-add-block="table">Add table</button>
                  <button type="button" class="secondary" data-add-block="text">Add text</button>
                </div>
                <ol id="layout-list" class="layout-list"></ol>
                <div id="ai-panel" hidden>
                  <button type="button" id="draft-summary" class="secondary">Draft summary</button>
                  <div id="draft" class="draft" data-no-preview hidden>
                    <label for="draft-text">Review summary</label>
                    <textarea id="draft-text" rows="5"></textarea>
                    <ul id="draft-warnings" class="errors"></ul>
                    <div class="button-row">
                      <button type="button" id="draft-accept">Add text block</button>
                      <button type="button" id="draft-regenerate" class="secondary">Regenerate</button>
                      <button type="button" id="draft-discard" class="link">Discard</button>
                    </div>
                  </div>
                </div>
              </fieldset>
            </section>

            <section id="builder-titles-panel" class="tab-panel panel" role="tabpanel" aria-labelledby="builder-titles-tab" hidden>
              <label class="check"><input type="checkbox" id="show-title" />Show report title</label>
              <label for="title">Title</label>
              <input id="title" maxlength="200" placeholder="Dataset and fields" />
              <label for="subtitle">Subtitle</label>
              <input id="subtitle" maxlength="300" placeholder="Dataset and vintage" />
            </section>

            <section id="builder-appearance-panel" class="tab-panel panel" role="tabpanel" aria-labelledby="builder-appearance-tab" hidden>
              <div id="report-style" data-no-preview></div>
            </section>
          </form>

          <section id="builder-preview-panel" class="tab-panel preview-pane" role="tabpanel" aria-labelledby="builder-preview-tab" hidden>
            <div id="preview"></div>
          </section>
        </div>
      </div>
    </main>
  </body>
</html>
