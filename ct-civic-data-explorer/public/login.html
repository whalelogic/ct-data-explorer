<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · CT Civic Data Explorer</title>
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/login.js"></script>
</head>
<body class="auth-page">
  <main id="main">
    <div class="panel">
      <h1>CT Civic Data Explorer</h1>
      <p class="muted">Build data cards about Connecticut towns and export them as PDFs.</p>
      <form id="login-form" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <p id="status" class="status" role="alert" hidden></p>
        <div class="button-row"><button type="submit">Sign in</button></div>
      </form>
      <p class="muted small">Forgot your password? Ask an administrator for a reset link.</p>
    </div>
  </main>
</body>
</html>
