<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · CT Civic Data Explorer</title>
    <link rel="stylesheet" href="/css/app.css" />
    <script type="module" src="/js/login.js"></script>
  </head>
  <body class="auth-page">
    <main id="main">
      <div class="panel">
        <p class="section-kicker">CT Civic Data Explorer</p>
        <h1>Sign in</h1>
        <form id="login-form" novalidate>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" required />
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
          <p id="status" class="status" role="alert" hidden></p>
          <div class="button-row"><button type="submit">Sign in</button></div>
        </form>
        <p class="muted small">Password reset: contact your administrator.</p>
      </div>
    </main>
  </body>
</html>
