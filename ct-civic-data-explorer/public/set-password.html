<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Set password · CT Civic Data Explorer</title>
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/set-password.js"></script>
</head>
<body class="auth-page">
  <main id="main">
    <div class="panel">
      <img class="auth-logo" src="/img/ctdata-logo.png" alt="CT Data Collaborative" width="140" height="48">
      <h1>Set your password</h1>
      <p id="greeting" class="muted"></p>
      <form id="password-form" novalidate hidden>
        <label for="password">New password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="12" required aria-describedby="password-help">
        <p id="password-help" class="muted small">At least 12 characters.</p>
        <label for="confirm">Confirm password</label>
        <input id="confirm" name="confirm" type="password" autocomplete="new-password" required>
        <div class="button-row"><button type="submit">Set Password and Sign In</button></div>
      </form>
      <p id="status" class="status" role="alert" hidden></p>
    </div>
  </main>
</body>
</html>
