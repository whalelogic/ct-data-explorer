<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dataset · CT Civic Data Explorer</title>
    <link rel="stylesheet" href="/css/app.css" />
    <script type="module" src="/js/dataset.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site"><a class="brand" href="/">CT Civic Data Explorer</a></header>
    <main id="main" class="container">
      <p><a id="back-link" href="/">← Datasets</a></p>
      <div class="page-toolbar">
        <h1 id="dataset-heading">Dataset</h1>
        <div id="dataset-actions" class="workspace-actions" hidden>
          <span id="publish-state" class="badge"></span>
          <a id="explore-dataset" class="button" hidden>Explore</a>
          <a id="make-report" class="button secondary" hidden>New report</a>
          <button id="toggle-active" type="button" class="secondary" hidden></button>
        </div>
      </div>
      <p id="page-status" class="status" role="alert" hidden></p>
      <button id="retry" type="button" class="secondary" hidden>Retry</button>
      <p id="dataset-status" class="status" role="status" hidden></p>
      <div id="dataset-content" data-tabs="dataset" hidden>
        <div class="workspace-tabs" role="tablist" aria-label="Dataset">
          <button id="dataset-overview-tab" type="button" role="tab" aria-controls="dataset-overview" aria-selected="true" tabindex="0">Overview</button>
          <button id="dataset-fields-tab" type="button" role="tab" aria-controls="dataset-fields" aria-selected="false" tabindex="-1">Fields</button>
          <button id="dataset-data-tab" type="button" role="tab" aria-controls="dataset-data" aria-selected="false" tabindex="-1">Data</button>
          <button id="dataset-appearance-tab" type="button" role="tab" aria-controls="dataset-appearance" aria-selected="false" tabindex="-1">Appearance</button>
        </div>
        <section id="dataset-overview" class="tab-panel" role="tabpanel" aria-labelledby="dataset-overview-tab">
          <dl id="dataset-metadata" class="saved-report-meta"></dl>
          <details id="dataset-notes" hidden>
            <summary>Import notes</summary>
            <ul id="dataset-note-list"></ul>
          </details>
        </section>
        <section id="dataset-fields" class="tab-panel" role="tabpanel" aria-labelledby="dataset-fields-tab" hidden>
          <div id="curation-panel" hidden>
            <div class="page-toolbar">
              <p id="curation-summary" class="curation-summary" role="status"></p>
              <button id="save-curation" type="button">Save approval</button>
            </div>
            <label for="curation-search">Search fields</label>
            <input id="curation-search" type="search" placeholder="Name or unit" autocomplete="off" />
            <div class="button-row">
              <button id="approve-visible" type="button" class="secondary">Select visible</button>
              <button id="clear-visible" type="button" class="secondary">Clear visible</button>
            </div>
            <div id="curation-fields" class="curation-fields field-list-scroll"></div>
            <p id="curation-status" class="status" role="status" hidden></p>
          </div>
          <div id="field-metadata" class="table-wrap field-list-scroll">
            <table class="data">
              <caption class="sr-only">Available fields</caption>
              <thead>
                <tr>
                  <th scope="col">Field</th>
                  <th scope="col">Type</th>
                  <th scope="col">Unit</th>
                  <th scope="col">Decimals</th>
                </tr>
              </thead>
              <tbody id="indicators-body"></tbody>
            </table>
          </div>
          <details id="indicator-setup" hidden>
            <summary>Add indicator</summary>
            <div id="dataset-indicator-editor"></div>
          </details>
        </section>
        <section id="dataset-data" class="tab-panel" role="tabpanel" aria-labelledby="dataset-data-tab" hidden>
          <div class="page-toolbar">
            <p id="preview-summary" class="muted small" role="status"></p>
            <div class="button-row">
              <button id="previous" type="button" class="secondary">Previous</button>
              <button id="next" type="button" class="secondary">Next</button>
            </div>
          </div>
          <div id="data-preview" class="table-wrap preview-scroll" tabindex="0" role="region" aria-label="Dataset rows"></div>
        </section>
        <section id="dataset-appearance" class="tab-panel" role="tabpanel" aria-labelledby="dataset-appearance-tab" hidden>
          <div id="dataset-presentation"></div>
        </section>
      </div>
    </main>
  </body>
</html>
