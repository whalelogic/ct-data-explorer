<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Explore data · CT Civic Data Explorer</title>
    <link rel="stylesheet" href="/css/app.css" />
    <script defer src="/vendor/chart.js/chart.umd.min.js"></script>
    <script type="module" src="/js/explore.js"></script>
  </head>
  <body class="explorer-page">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site"><a class="brand" href="/">CT Civic Data Explorer</a></header>
    <main id="main" class="container">
      <div class="page-toolbar">
        <h1>Explore data</h1>
        <div class="workspace-actions" aria-label="View actions">
          <button id="open-builder" type="button" disabled>New report</button>
          <button id="share-view" type="button" class="secondary" disabled>Copy link</button>
          <button id="export-pdf" type="button" class="secondary" disabled>Export PDF</button>
        </div>
      </div>
      <p id="page-status" class="status" role="alert" hidden></p>
      <p id="action-status" class="status" role="status" aria-live="polite" hidden></p>
      <p id="preview-status" class="status" role="status" aria-live="polite" hidden></p>
      <div id="share-fallback" hidden>
        <label for="share-link">View link</label>
        <input id="share-link" readonly />
      </div>
      <form id="explorer-form" class="panel" aria-label="Explore dataset">
        <label for="dataset">Dataset</label>
        <select id="dataset" disabled aria-describedby="dataset-caption">
          <option>Loading datasets…</option>
        </select>
        <p id="dataset-caption" class="sr-only"></p>
        <div data-tabs="explore">
          <div class="workspace-tabs" role="tablist" aria-label="Explore dataset">
            <button id="explore-fields-tab" type="button" role="tab" aria-controls="explore-fields" aria-selected="true" tabindex="0">Fields</button>
            <button id="explore-filters-tab" type="button" role="tab" aria-controls="explore-filters" aria-selected="false" tabindex="-1" hidden>Filters</button>
            <button id="explore-view-tab" type="button" role="tab" aria-controls="explore-view" aria-selected="false" tabindex="-1">View</button>
          </div>
          <section id="explore-fields" class="tab-panel" role="tabpanel" aria-labelledby="explore-fields-tab">
            <fieldset id="field-controls" disabled>
              <legend>Fields</legend>
              <label id="field-search-label" for="field-search">Search fields</label>
              <input id="field-search" class="field-search" type="search" placeholder="Name or unit" />
              <div class="explorer-field-summary">
                <p id="field-count" class="small muted" role="status" aria-live="polite">0 selected</p>
                <button id="clear-fields" type="button" class="link" disabled>Clear</button>
              </div>
              <div id="field-list" class="explorer-fields"></div>
              <p id="field-status" class="status small" role="status" aria-live="polite" hidden></p>
            </fieldset>
            <div class="workspace-actions">
              <button id="show-view" type="button" disabled>View data</button>
            </div>
          </section>
          <section id="explore-filters" class="tab-panel" role="tabpanel" aria-labelledby="explore-filters-tab" hidden>
            <fieldset id="location-controls" disabled hidden>
              <legend>Locations</legend>
              <div id="town-controls">
                <label for="town-input">Towns</label>
                <div class="explorer-town-entry">
                  <input id="town-input" list="town-options" autocomplete="off" placeholder="Find a town" aria-describedby="town-help" />
                  <button id="add-town" type="button" class="secondary">Add</button>
                </div>
                <datalist id="town-options"></datalist>
                <div class="explorer-town-actions">
                  <button id="select-all-towns" type="button" class="link">Select all</button>
                  <button id="clear-towns" type="button" class="link" disabled>Clear</button>
                </div>
                <p id="town-help" class="small muted" role="status" aria-live="polite">All towns</p>
                <p id="town-status" class="status small" role="status" aria-live="polite" hidden></p>
                <div id="chosen-towns" class="explorer-towns" role="region" aria-label="Selected towns" tabindex="0" hidden></div>
              </div>
              <label id="benchmark-control" class="check" hidden>
                <input type="checkbox" id="benchmark" />
                Connecticut comparison
              </label>
            </fieldset>
            <fieldset id="filter-controls" hidden>
              <legend>Filter rows</legend>
              <div id="record-filters"></div>
            </fieldset>
          </section>
          <section id="explore-view" class="tab-panel explorer-stage" role="tabpanel" aria-labelledby="explore-view-tab" hidden>
            <div class="explorer-toolbar">
              <div>
                <h2 id="view-heading">Data view</h2>
                <p id="selection-summary" class="small muted"></p>
              </div>
              <div id="visualization-controls" class="explorer-view-controls" hidden>
                <div>
                  <label for="chart-type">Display</label>
                  <select id="chart-type" aria-describedby="chart-help">
                    <option value="grouped_bar">Compare fields</option>
                    <option value="bar">Separate charts</option>
                    <option value="line">Line charts</option>
                    <option value="table">Table</option>
                  </select>
                </div>
              </div>
            </div>
            <p id="chart-help" class="explorer-tip small muted" hidden></p>
            <div id="explorer-empty" class="empty-state">
              <h3>No fields selected</h3>
              <button id="choose-fields" type="button" class="secondary">Choose fields</button>
            </div>
            <div id="preview" aria-label="Selected data"></div>
            <div id="dataset-source" class="explorer-source" hidden></div>
          </section>
        </div>
      </form>
    </main>
  </body>
</html>
