<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Explore reports · CT Civic Data Explorer</title>
    <link rel="stylesheet" href="/css/app.css" />
    <script type="module" src="/js/explore.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site"><a class="brand" href="/">CT Civic Data Explorer</a></header>
    <main id="main" class="container">
      <div class="workspace-heading">
        <div>
          <p class="section-kicker">Explore</p>
          <h1>Reports</h1>
          <p class="page-intro">Open a saved report to explore its charts and tables, compare its rows, or export it as a PDF.</p>
        </div>
        <a class="button" href="/builder">New report</a>
      </div>
      <p id="page-status" class="status" role="alert" hidden></p>

      <form id="gallery-filters" class="gallery-filters" role="search" aria-label="Find a report">
        <div class="gallery-search">
          <label for="gallery-search">Search</label>
          <input id="gallery-search" type="search" maxlength="100" placeholder="Report or dataset name" autocomplete="off" />
        </div>
        <div>
          <label for="gallery-dataset">Dataset</label>
          <select id="gallery-dataset">
            <option value="">All datasets</option>
          </select>
        </div>
        <div>
          <label for="gallery-sort">Sort</label>
          <select id="gallery-sort">
            <option value="updated">Recently updated</option>
            <option value="title">Name A–Z</option>
            <option value="oldest">Oldest first</option>
          </select>
        </div>
        <label class="check gallery-mine"><input id="gallery-mine" type="checkbox" /> Only my reports</label>
      </form>

      <p id="gallery-status" class="gallery-count small muted" role="status" aria-live="polite">Loading reports…</p>
      <p id="report-action-status" class="status" role="status" hidden></p>
      <ul id="gallery" class="report-gallery" role="list" aria-busy="true"></ul>
      <div id="gallery-empty" class="dashboard-empty" hidden>
        <h2 id="gallery-empty-title">No reports yet</h2>
        <p id="gallery-empty-text">Build a report from a dataset, then save it to see it here.</p>
        <a class="button secondary" href="/builder">Create a report</a>
      </div>
    </main>
  </body>
</html>
